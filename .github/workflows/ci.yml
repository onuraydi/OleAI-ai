name: AI Service CI

on:
  push:
    branches: [ "master"]
  pull_request:
    branches: [ "master"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # SonarQube'un kod analizini doğru yapabilmesi için tüm commit geçmişi gerekir.

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: 'pip'  # Bağımlılıkların daha hızlı kurulması için pip önbelleğe alınır.

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with Ruff
      run: |
        ruff check .  # Kod standartlarına (PEP-8) uyumu denetler.

    - name: Run tests with Pytest and Coverage
      run: |
        pytest --cov=src --cov-report=xml  # Testleri koşturur ve SonarQube için XML formatında kapsam raporu üretir.

    - name: SonarQube Scan
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}